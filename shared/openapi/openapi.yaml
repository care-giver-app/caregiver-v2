openapi: 3.0.3
info:
  title: Caregiver API
  version: 0.1.0
  description: Caregiver v2 API contract — source of truth.
servers:
  - url: https://api.dev.example.com
    description: dev
  - url: https://api.example.com
    description: prod
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns service health and build metadata.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /flags:
    get:
      operationId: getFlags
      summary: Return evaluated feature flags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flags'
  /me:
    get:
      operationId: getMe
      summary: Current user and their care-group memberships
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /care-groups:
    post:
      operationId: createCareGroup
      summary: Create a care group; caller becomes Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCareGroupRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareGroupMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /care-groups/{careGroupId}/invitations:
    post:
      operationId: createInvitation
      summary: Invite a user to the care group by email (admin only)
      parameters:
        - { name: careGroupId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /care-groups/{careGroupId}/invitations/{token}:
    delete:
      operationId: revokeInvitation
      summary: Revoke a pending invitation (admin only)
      parameters:
        - { name: careGroupId, in: path, required: true, schema: { type: string } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /invitations/mine:
    get:
      operationId: listMyInvitations
      summary: Pending invitations for the caller's verified email
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation by token; creates a membership
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /receivers:
    get:
      operationId: listReceivers
      summary: List receivers across the caller's groups (optionally one group)
      parameters:
        - { name: careGroupId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Receiver' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /care-groups/{careGroupId}/members:
    get:
      operationId: listMembers
      summary: List the members of a care group (any member)
      parameters:
        - { name: careGroupId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /care-groups/{careGroupId}/receivers:
    post:
      operationId: createReceiver
      summary: Add a receiver to a care group (admin only)
      parameters:
        - { name: careGroupId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReceiverRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receiver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /receivers/{receiverId}:
    get:
      operationId: getReceiver
      summary: Get a receiver
      parameters:
        - { name: receiverId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receiver' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateReceiver
      summary: Update a receiver (admin only)
      parameters:
        - { name: receiverId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReceiverRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receiver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: archiveReceiver
      summary: Archive a receiver (admin only)
      parameters:
        - { name: receiverId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /receivers/{receiverId}/trackers:
    get:
      operationId: listTrackers
      summary: List a receiver's trackers
      parameters:
        - { name: receiverId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tracker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTracker
      summary: Create a tracker for a receiver (admin only)
      parameters:
        - { name: receiverId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackerWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracker' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /trackers/{trackerId}:
    get:
      operationId: getTracker
      summary: Get a tracker
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTracker
      summary: Update a tracker (admin only)
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackerWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracker' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: archiveTracker
      summary: Archive a tracker (admin only)
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /trackers/{trackerId}/events:
    get:
      operationId: listEvents
      summary: List a tracker's events, newest first (paginated)
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: logEvent
      summary: Log an event against a tracker
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /trackers/{trackerId}/events/{eventId}:
    get:
      operationId: getEvent
      summary: Get a single event
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateEvent
      summary: Edit a logged event
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
        - { name: eventId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteEvent
      summary: Delete a logged event
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /trackers/{trackerId}/scheduled-items:
    get:
      operationId: listScheduledItems
      summary: List a tracker's scheduled items, soonest first (paginated)
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledItemList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createScheduledItem
      summary: Add a scheduled item to a scheduled tracker
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledItemWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /receivers/{receiverId}/scheduled-items:
    get:
      operationId: listReceiverScheduledItems
      summary: List a receiver's scheduled items across trackers, soonest first (paginated)
      parameters:
        - { name: receiverId, in: path, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledItemList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /scheduled-items/{scheduledItemId}:
    get:
      operationId: getScheduledItem
      summary: Get a single scheduled item
      parameters:
        - { name: scheduledItemId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateScheduledItem
      summary: Reschedule or edit a scheduled item
      parameters:
        - { name: scheduledItemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledItemWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteScheduledItem
      summary: Delete a scheduled item
      parameters:
        - { name: scheduledItemId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tracker-templates:
    get:
      operationId: listTrackerTemplates
      summary: List the seeded tracker-template catalog
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrackerTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ---------------------------------------------------------------------------
  # /v1 — the target model (ADR 0012), served beside the paths above until the
  # cutover removes them (ADR 0013). Reads and writes only the new tables.
  # ---------------------------------------------------------------------------
  /v1/me:
    get:
      operationId: getMyAccount
      summary: The signed-in caregiver and the care teams they belong to
      description: >
        The sign-in resolution. An empty `teams` sends the caregiver to Join a care
        team; anything else sends them to Home. Archived teams are not listed. The
        caller's record is created on first call from the verified ID token.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/teams:
    post:
      operationId: createTeam
      summary: Create a care team; the caller becomes its first admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/invitations:
    get:
      operationId: listInvitationsForMe
      summary: Pending invitations addressed to the caller's verified email
      description: >
        Includes invitations to teams the caller already belongs to; redeeming one
        of those is refused with 409. Expired, accepted, and revoked invitations
        are not listed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InvitationForMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/invitations/redeem:
    post:
      operationId: redeemInvitation
      summary: Join a care team as a caregiver, by invite code
      description: >
        Serves both accepting an invitation found under /v1/me/invitations and
        pasting a code. The code travels in the body, never the path, so it does
        not land in access logs. The caller's email is not checked against the
        invitation (Hide My Email); membership is.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemInvitationRequest' }
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/AlreadyMember' }
        '410': { $ref: '#/components/responses/InvitationNotValid' }
  /v1/teams/{teamId}/receivers:
    get:
      operationId: listTeamReceivers
      summary: The care team's care receivers, oldest first
      description: >
        Read-only here so the app can choose the active care receiver; adding,
        editing and archiving them belong to the Team area. Archived receivers are
        not listed. Any member may call it.
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CareReceiver' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/receivers/{receiverId}/trackers:
    get:
      operationId: listReceiverTrackers
      summary: Every tracker of one care receiver, active and paused
      description: >
        Serves the Trackers list. All three filters are drawn from this one
        response, so their counts agree with what each shows. Sorted by name; a
        paused tracker never needs attention.
      parameters:
        - { name: receiverId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrackerRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addTracker
      summary: Create a tracker for an active care receiver (admin only)
      description: >
        Add tracker's Create. Takes no schedules — those are written afterward in
        Edit tracker. The server assigns every field and option id.
      parameters:
        - { name: receiverId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTracker' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/trackers/{trackerId}:
    get:
      operationId: getTrackerDetail
      summary: One tracker, with what is wrong with it right now
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: editTracker
      summary: Edit tracker's Save (admin only)
      description: >
        Name, icon, color, fields and gap commit together. Schedules are not part
        of this request; each is written on its own sheet's Save. Allowed on a
        paused tracker. Refused with 400 if `fields` leaves out an existing field
        (fields are paused, never removed), drops an existing choice option
        (options are retired, never removed), or changes an existing field's type
        (a type is fixed once the tracker exists). Turning a gap on while the
        tracker has schedules is refused with 409 unless `remove_schedules` is
        true, which removes every schedule as DELETE /v1/schedules/{scheduleId}
        would.
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackerChanges' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SchedulesOrGap' }
  /v1/trackers/{trackerId}/pause:
    post:
      operationId: pauseTracker
      summary: Pause a tracker (admin only)
      description: >
        No new entries, its schedules stop generating, and its thresholds stop
        raising alerts. Occurrences still waiting in the future are deleted;
        everything logged, skipped or already unrecorded stays. Pausing a paused
        tracker changes nothing.
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/trackers/{trackerId}/resume:
    post:
      operationId: resumeTracker
      summary: Resume a paused tracker (admin only)
      description: >
        Its schedules generate again from now, and its thresholds raise alerts
        again. Nothing is back-filled across the pause. Resuming an active tracker
        changes nothing.
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/trackers/{trackerId}/entries:
    get:
      operationId: listTrackerEntries
      summary: A tracker's entries, newest first
      description: >
        Logged, skipped and unrecorded together. Entries still to come are never
        listed — Coming up is what looks ahead. `from` and `to` are dates in the
        receiver's time zone, inclusive; without them the list runs back through
        everything, a page at a time.
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/trackers/{trackerId}/schedules:
    get:
      operationId: listTrackerSchedules
      summary: A tracker's schedules, readable by anyone on the team
      description: Removed schedules are not listed.
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrackerSchedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addSchedule
      summary: A schedule's Save, for a new schedule (admin only)
      description: >
        Written at once, not with Edit tracker's Save. It starts today in the
        receiver's time zone, and its occurrences exist by the time this returns.
        On a tracker watched by a gap it is refused with 409 unless `replace_gap`
        is true, which turns the gap off. On a paused tracker it is stored but
        generates nothing until the tracker is resumed.
      parameters:
        - { name: trackerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSchedule' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerSchedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SchedulesOrGap' }
  /v1/schedules/{scheduleId}:
    put:
      operationId: changeSchedule
      summary: A schedule's Save, for an existing schedule (admin only)
      description: >
        Written at once. Its still-waiting future occurrences are replaced by ones
        made from the new rule, time and pre-filled values; nothing logged,
        skipped or already unrecorded moves.
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerSchedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeSchedule
      summary: Remove this schedule? — Remove (admin only)
      description: >
        The rule and every occurrence it made that is still waiting go. Every
        entry already logged, skipped or unrecorded stays exactly where it is, and
        still names the schedule it came from.
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/tracker-templates:
    get:
      operationId: listTemplates
      summary: The tracker template catalogue
      description: >
        Ordered as Add tracker shows them. A template carries no ids for its
        fields; creating a tracker from one assigns them.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito-issued JWT access token, validated by the API Gateway JWT authorizer.
  schemas:
    Health:
      type: object
      required: [status, version, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          example: '0.1.0'
        timestamp:
          type: string
          format: date-time
    Flags:
      type: object
      additionalProperties: true
      example:
        flags_demo:
          enabled: false
    Role:
      type: string
      enum: [admin, caregiver]
    User:
      type: object
      required: [user_id, email, name, created_at]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        created_at: { type: string, format: date-time }
    MembershipView:
      type: object
      required: [care_group_id, name, role]
      properties:
        care_group_id: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Member:
      type: object
      required: [user_id, name, role]
      properties:
        user_id: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Me:
      type: object
      required: [user, memberships]
      properties:
        user: { $ref: '#/components/schemas/User' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipView' }
    CreateCareGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    CareGroupMembership:
      type: object
      required: [care_group_id, name, role]
      properties:
        care_group_id: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
    Invitation:
      type: object
      required: [token, email, role, expires_at]
      properties:
        token: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        expires_at: { type: string, format: date-time }
    PendingInvitation:
      type: object
      required: [token, care_group_id, care_group_name, role, invited_by]
      properties:
        token: { type: string }
        care_group_id: { type: string }
        care_group_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        invited_by: { type: string }
    AcceptInvitationResponse:
      type: object
      required: [care_group_id, role]
      properties:
        care_group_id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    TrackerKind:
      type: string
      enum: [event, measurement, scheduled]
    FieldType:
      type: string
      enum: [number, text, boolean, enum, datetime]
    Threshold:
      type: object
      properties:
        min: { type: number }
        max: { type: number }
    Field:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string }
        label: { type: string }
        type: { $ref: '#/components/schemas/FieldType' }
        unit: { type: string }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
        threshold: { $ref: '#/components/schemas/Threshold' }
    Receiver:
      type: object
      required: [receiver_id, care_group_id, name, created_by, created_at, archived]
      properties:
        receiver_id: { type: string }
        care_group_id: { type: string }
        name: { type: string }
        date_of_birth: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        archived: { type: boolean }
    CreateReceiverRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        date_of_birth: { type: string }
    UpdateReceiverRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        date_of_birth: { type: string }
    Tracker:
      type: object
      required:
        [
          tracker_id,
          receiver_id,
          care_group_id,
          name,
          kind,
          fields,
          created_by,
          created_at,
          archived,
        ]
      properties:
        tracker_id: { type: string }
        receiver_id: { type: string }
        care_group_id: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/TrackerKind' }
        icon: { type: string }
        color: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/Field' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        archived: { type: boolean }
    TrackerWrite:
      type: object
      required: [name, kind, fields]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: '#/components/schemas/TrackerKind' }
        icon: { type: string }
        color: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/Field' }
    TrackerTemplate:
      type: object
      required: [template_id, name, kind, fields]
      properties:
        template_id: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/TrackerKind' }
        icon: { type: string }
        color: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/Field' }
    Breach:
      type: object
      required: [key, value, bound, limit]
      properties:
        key: { type: string }
        value: { type: number }
        bound: { type: string, enum: [min, max] }
        limit: { type: number }
    Event:
      type: object
      required:
        [
          tracker_id,
          event_id,
          care_group_id,
          receiver_id,
          values,
          occurred_at,
          logged_by,
          created_at,
        ]
      properties:
        tracker_id: { type: string }
        event_id: { type: string }
        care_group_id: { type: string }
        receiver_id: { type: string }
        values:
          type: object
          additionalProperties: true
        note: { type: string }
        occurred_at: { type: string, format: date-time }
        logged_by: { type: string }
        created_at: { type: string, format: date-time }
        breaches:
          type: array
          items: { $ref: '#/components/schemas/Breach' }
    EventWrite:
      type: object
      required: [values]
      properties:
        occurred_at: { type: string, format: date-time }
        values:
          type: object
          additionalProperties: true
        note: { type: string }
    EventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        next_cursor: { type: string }
    ScheduledItem:
      type: object
      required:
        [
          scheduled_item_id,
          tracker_id,
          care_group_id,
          receiver_id,
          values,
          scheduled_for,
          created_by,
          created_at,
        ]
      properties:
        scheduled_item_id: { type: string }
        tracker_id: { type: string }
        care_group_id: { type: string }
        receiver_id: { type: string }
        values:
          type: object
          additionalProperties: true
        note: { type: string }
        scheduled_for: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    ScheduledItemWrite:
      type: object
      required: [scheduled_for]
      properties:
        scheduled_for: { type: string, format: date-time }
        values:
          type: object
          additionalProperties: true
        note: { type: string }
    ScheduledItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ScheduledItem' }
        next_cursor: { type: string }
    # --- /v1 ---------------------------------------------------------------
    Caregiver:
      type: object
      required: [user_id, email, name]
      properties:
        user_id: { type: string, description: Cognito sub }
        email: { type: string, format: email }
        name: { type: string }
    TeamMembership:
      type: object
      required: [team_id, name, role]
      properties:
        team_id: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    MyAccount:
      type: object
      required: [caregiver, teams]
      properties:
        caregiver: { $ref: '#/components/schemas/Caregiver' }
        teams:
          type: array
          items: { $ref: '#/components/schemas/TeamMembership' }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    InvitationForMe:
      type: object
      required: [code, team_id, team_name, invited_by_name, expires_at]
      properties:
        code: { type: string }
        team_id: { type: string }
        team_name: { type: string }
        invited_by_name:
          type: string
          description: The inviting admin's name, or "a former caregiver"
        expires_at: { type: string, format: date-time }
    RedeemInvitationRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1 }
    CareReceiver:
      type: object
      required: [receiver_id, team_id, name, time_zone]
      properties:
        receiver_id: { type: string }
        team_id: { type: string }
        name: { type: string }
        time_zone:
          type: string
          description: IANA zone every wall-clock time about this receiver is read in
    TrackerStatus:
      type: string
      enum: [active, paused]
    FieldKind:
      type: string
      enum: [number, text, boolean, choice, datetime]
    FieldStatus:
      type: string
      enum: [active, paused]
    ValueRange:
      type: object
      description: >
        Where a number is expected to stay. Either bound may be left open. A
        number field with no range never alerts.
      properties:
        low: { type: number }
        high: { type: number }
    ChoiceOption:
      type: object
      required: [option_id, label, status]
      properties:
        option_id: { type: string }
        label: { type: string }
        status: { type: string, enum: [active, retired] }
    TrackerField:
      type: object
      required: [field_id, label, type, required, status]
      properties:
        field_id: { type: string, description: 'Stable, never reused within its tracker' }
        label: { type: string }
        type: { $ref: '#/components/schemas/FieldKind' }
        unit: { type: string, description: number only }
        required: { type: boolean }
        status: { $ref: '#/components/schemas/FieldStatus' }
        range: { $ref: '#/components/schemas/ValueRange' }
        multiple: { type: boolean, description: choice only — one answer or several }
        options:
          type: array
          description: choice only. Never shrinks; options are retired instead.
          items: { $ref: '#/components/schemas/ChoiceOption' }
    ChoiceOptionWrite:
      type: object
      required: [label]
      properties:
        option_id: { type: string, description: Absent for a new option }
        label: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [active, retired], default: active }
    TrackerFieldWrite:
      type: object
      required: [label, type, required]
      properties:
        field_id: { type: string, description: Absent for a new field }
        label: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: '#/components/schemas/FieldKind' }
        unit: { type: string, maxLength: 20 }
        required: { type: boolean }
        status: { $ref: '#/components/schemas/FieldStatus' }
        range: { $ref: '#/components/schemas/ValueRange' }
        multiple: { type: boolean }
        options:
          type: array
          items: { $ref: '#/components/schemas/ChoiceOptionWrite' }
    TrackerRow:
      type: object
      required: [tracker_id, name, icon, color, status, needs_attention]
      properties:
        tracker_id: { type: string }
        name: { type: string }
        icon: { type: string }
        color: { type: string }
        status: { $ref: '#/components/schemas/TrackerStatus' }
        last_logged_at:
          type: string
          format: date-time
          description: Absent when nothing has ever been logged against it
        paused_at: { type: string, format: date-time }
        needs_attention: { type: boolean, description: Always false when paused }
    TrackerAttention:
      type: object
      description: >
        One thing wrong with a tracker right now, worked out when it is read.
        `unrecorded` — an occurrence whose time has passed with nothing logged or
        skipped, for forty-eight hours after that time, whether or not it alerts
        anyone (`entry_id`, `occurrence_at`). `out_of_range` — a number field
        whose latest logged reading is outside its range (`entry_id`, `field_id`,
        `value`, `range`). `gap` — longer than `gap_hours` since the last entry,
        or since the tracker was created when there has never been one (`since`,
        `gap_hours`).
      required: [kind]
      properties:
        kind: { type: string, enum: [unrecorded, out_of_range, gap] }
        entry_id: { type: string }
        occurrence_at: { type: string, format: date-time }
        field_id: { type: string }
        value: { type: number }
        range: { $ref: '#/components/schemas/ValueRange' }
        since: { type: string, format: date-time }
        gap_hours: { type: integer }
    TrackerDetail:
      type: object
      required:
        [
          tracker_id,
          receiver_id,
          team_id,
          name,
          icon,
          color,
          status,
          fields,
          schedule_count,
          attention,
          created_at,
        ]
      properties:
        tracker_id: { type: string }
        receiver_id: { type: string }
        team_id: { type: string }
        name: { type: string }
        icon: { type: string }
        color: { type: string }
        status: { $ref: '#/components/schemas/TrackerStatus' }
        paused_at: { type: string, format: date-time }
        fields:
          type: array
          description: Every field it has ever had, paused ones included, in order
          items: { $ref: '#/components/schemas/TrackerField' }
        gap_hours:
          type: integer
          description: Absent when no gap watches it. Never present alongside schedules.
        schedule_count: { type: integer }
        last_logged_at: { type: string, format: date-time }
        attention:
          type: array
          description: Empty when nothing is wrong, and always empty when paused
          items: { $ref: '#/components/schemas/TrackerAttention' }
        created_at: { type: string, format: date-time }
    NewTracker:
      type: object
      required: [name, icon, color, fields]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string, description: An SF Symbol name }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        fields:
          type: array
          items: { $ref: '#/components/schemas/TrackerFieldWrite' }
        gap_hours: { type: integer, minimum: 1 }
    TrackerChanges:
      type: object
      description: Everything Edit tracker's Save commits; schedules and pausing are separate.
      required: [name, icon, color, fields, gap_hours]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        fields:
          type: array
          description: >
            Every existing field by its `field_id`, in the order to show them, plus
            any new ones without one
          items: { $ref: '#/components/schemas/TrackerFieldWrite' }
        gap_hours:
          type: integer
          minimum: 1
          nullable: true
          description: null turns the gap off
        remove_schedules:
          type: boolean
          default: false
          description: Confirms that turning the gap on removes every schedule
    Weekday:
      type: string
      enum: [MO, TU, WE, TH, FR, SA, SU]
    Recurrence:
      type: object
      description: >
        A rule, not a preset (ADR 0012). The app's choices write into it — every
        week, two weeks, month and two months are intervals of 1, 2, 4 and 8
        weeks. More frequencies can be added later without migrating data.
      required: [freq, interval, by_day]
      properties:
        freq: { type: string, enum: [weekly] }
        interval: { type: integer, minimum: 1 }
        by_day:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Weekday' }
    TrackerSchedule:
      type: object
      required:
        [schedule_id, tracker_id, name, rule, time, starts_on, planned_values, unrecorded_alert]
      properties:
        schedule_id: { type: string }
        tracker_id: { type: string }
        label: { type: string, description: What an admin typed; absent when left blank }
        name:
          type: string
          description: The label, or a name derived from the schedule when it has none
        rule: { $ref: '#/components/schemas/Recurrence' }
        time: { type: string, description: "Local HH:MM in the receiver's time zone" }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        planned_values:
          type: object
          description: Pre-filled values keyed by field_id; a choice is a list of option_ids
          additionalProperties: true
        unrecorded_alert: { type: boolean }
    ScheduleWrite:
      type: object
      required: [rule, time, planned_values, unrecorded_alert]
      properties:
        label: { type: string, maxLength: 100 }
        rule: { $ref: '#/components/schemas/Recurrence' }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        ends_on: { type: string, format: date }
        planned_values:
          type: object
          additionalProperties: true
        unrecorded_alert: { type: boolean }
    NewSchedule:
      type: object
      required: [rule, time, planned_values, unrecorded_alert]
      properties:
        label: { type: string, maxLength: 100 }
        rule: { $ref: '#/components/schemas/Recurrence' }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        ends_on: { type: string, format: date }
        planned_values:
          type: object
          additionalProperties: true
        unrecorded_alert: { type: boolean }
        replace_gap:
          type: boolean
          default: false
          description: Confirms that the first schedule turns the tracker's gap off
    EntryState:
      type: string
      description: Unrecorded is never stored; it is a scheduled entry whose time has passed.
      enum: [scheduled, unrecorded, logged, skipped]
    Entry:
      type: object
      required: [entry_id, tracker_id, state, at, values]
      properties:
        entry_id: { type: string }
        tracker_id: { type: string }
        state: { $ref: '#/components/schemas/EntryState' }
        at:
          type: string
          format: date-time
          description: When the care happened if logged, otherwise when it was due
        values:
          type: object
          description: Keyed by field_id; a choice is a list of option_ids
          additionalProperties: true
        note: { type: string }
        by_name:
          type: string
          description: >
            Who logged or skipped it, or "a former caregiver"; absent while
            unrecorded
        schedule_id: { type: string }
        schedule_name: { type: string, description: Present when it came from a schedule }
    EntryPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
        next_cursor: { type: string, description: Absent on the last page }
    CatalogTemplate:
      type: object
      required: [template_id, name, icon, color, fields]
      properties:
        template_id: { type: string }
        name: { type: string }
        icon: { type: string }
        color: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/TrackerFieldWrite' }
        gap_hours: { type: integer }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict (duplicate)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: Invitation expired or already used
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AlreadyMember:
      description: The caller already belongs to this care team
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvitationNotValid:
      description: >
        The code is unknown, expired, already used, or revoked. One answer for all
        four, per the PRD — none of them changes what the caregiver does next.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SchedulesOrGap:
      description: >
        A tracker has schedules or a gap, never both. Resend with the confirming
        flag once the admin has been told what they are about to lose.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
